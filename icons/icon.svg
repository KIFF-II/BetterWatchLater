<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Better Watch Later: a clock (Watch Later) with a tick (sorted out). -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b4a"/>
      <stop offset="1" stop-color="#d9264a"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#background)"/>

  <!-- Clock face and hands -->
  <circle cx="56" cy="56" r="34" fill="none" stroke="#fff" stroke-width="10"/>
  <path d="M56 36 V56 H72" fill="none" stroke="#fff" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tick badge, with a ring in the background colour so it stands apart from the clock -->
  <circle cx="94" cy="94" r="27" fill="#d9264a"/>
  <circle cx="94" cy="94" r="21" fill="#fff"/>
  <path d="M84 94.5 L91 101.5 L104.5 87.5" fill="none" stroke="#d9264a" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
